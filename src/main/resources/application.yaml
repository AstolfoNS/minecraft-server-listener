spring:
  application:
    name: minecraft
server:
  port: 8081
  servlet:
    context-path: /api/minecraft
security:
  hmac-secret: ${HMAC_SECRET}
  max-skew-seconds: 60
  header-ts: X-TS
  header-nonce: X-NONCE
  header-sign: X-SIGN
minecraft:
  servers:
    - id: vanilla
      work-dir: /www/minecraft/VanillaEra
      run-script: ./run.sh